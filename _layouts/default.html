<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="header">{{ site.title }}</h1>
        <p class="header">{{ site.description }}</p>

        <!-- EL TEU MENÚ DE BOTONS -->
        <ul>
          <li><a class="buttons github" href="{{ '/' | relative_url }}">Inici</a></li>
          <li><a class="buttons github" href="{{ '/projectes.html' | relative_url }}">Projectes</a></li>
          <li><a class="buttons github" href="{{ '/sobre-mi.html' | relative_url }}">Sobre mi</a></li>
        </ul>

        <!-- TEXT EXTRA AL REQUADRE ESQUERRE (Opcional) -->

      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p><small>Fet amb Jekyll i GitHub Pages</small></p>
      </footer>
    </div>
  </body>
</html>
