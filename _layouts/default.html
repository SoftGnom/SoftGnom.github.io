<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="header">{{ site.title }}</h1>
        <p class="header">{{ site.description }}</p>

        <!-- EL TEU MENÚ DE BOTONS -->
        <ul>
          <li><a class="buttons" href="{{ '/' | relative_url }}">Inici</a></li>
          <li><a class="buttons" href="{{ '/projectes.html' | relative_url }}">Projectes</a></li>
          <li><a class="buttons" href="{{ '/sobre-mi.html' | relative_url }}">Sobre mi</a></li>
        </ul>

        <!-- TEXT EXTRA AL REQUADRE ESQUERRE (Opcional) -->
        <p class="header">📬 Contacte</p>

        <div class="header-social">
            <a href="https://github.com/SoftGnom" target="_blank" rel="noopener noreferrer">
                <img src="https://img.shields.io/badge/GitHub-SoftGnom-181717?style=for-the-badge&logo=github" alt="GitHub Portfolio">
            </a>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="mailto:el-teu-email@domini.com">
                <img src="https://img.shields.io/badge/Email-Contact_Me-D14836?style=for-the-badge&logo=gmail" alt="Email">
            </a>
        </div>
      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p><small>Fet amb Jekyll i GitHub Pages</small></p>
      </footer>
    </div>
  </body>
</html>
