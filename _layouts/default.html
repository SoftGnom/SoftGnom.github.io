{% assign lang = page.lang | default: "ca" %}
{% assign t = site.data.traduccions[lang] %}

<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  </head>
  <body>
    <div class="wrapper">
      <header>

        <!-- MENÚ DINÀMIC -->
        <h1 class="header">{{ site.title }}</h1>
        <p class="header">{{ t.descripcio }}</p>
        <ul>
          <li><a class="buttons github" href="{{ '/' | append: lang | append: '/' | relative_url }}">{{ t.inici }}</a></li>
          <li><a class="buttons github" href="{{ '/' | append: lang | append: '/projectes.html' | relative_url }}">{{ t.projectes }}</a></li>
          <li><a class="buttons github" href="{{ '/' | append: lang | append: '/sobre-mi.html' | relative_url }}">{{ t.sobre_mi }}</a></li>
        </ul>

        <!-- SELECTOR DE 3 IDIOMES -->
        <p class="header">
          🌐 <a href="{{ '/ca/' | relative_url }}">CA</a> | 
          <a href="{{ '/es/' | relative_url }}">ES</a> | 
          <a href="{{ '/en/' | relative_url }}">EN</a>
        </p>

      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p><small>{{ t.peu }}</small></p>
      </footer>
    </div>
  </body>
</html>
